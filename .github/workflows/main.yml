name: Build macOS Installer

on:
  push:
    branches:
      - ralph
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure packaging tools are present
          pip install py2app

      - name: Download llama.cpp binaries
        run: |
          LLAMA_VERSION="b5046"
          mkdir -p bin
          
          # Download ARM64 binary for Apple Silicon
          echo "Downloading llama.cpp ARM64 binary..."
          curl -L "https://github.com/ggerganov/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-macos-arm64.tar.gz" \
            -o /tmp/llama-arm64.tar.gz
          tar -xzf /tmp/llama-arm64.tar.gz -C /tmp
          cp /tmp/build/bin/llama-cli bin/llama-cli-arm64
          
          # Download x64 binary for Intel Macs
          echo "Downloading llama.cpp x64 binary..."
          curl -L "https://github.com/ggerganov/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-macos-x64.tar.gz" \
            -o /tmp/llama-x64.tar.gz
          tar -xzf /tmp/llama-x64.tar.gz -C /tmp
          cp /tmp/build/bin/llama-cli bin/llama-cli-x64
          
          chmod +x bin/*
          echo "Binaries downloaded:"
          ls -la bin/

      - name: Setup Build Environment
        run: |
          chmod +x build_app.sh
          # Ensure the app icon is in the root as expected by setup.py
          if [ ! -f "app_icon.icns" ]; then
            echo "Warning: app_icon.icns not found."
          fi

      - name: Build macOS App Bundle
        run: |
          # Executes the py2app build sequence defined in build_app.sh
          ./build_app.sh

      - name: Package as DMG
        run: |
          brew install create-dmg
          mkdir -p dist/dmg
          # Create a professional DMG installer with an Applications link
          create-dmg \
            --volname "EmailDownloader" \
            --volicon "app_icon.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "EmailDownloader.app" 200 190 \
            --hide-extension "EmailDownloader.app" \
            --app-drop-link 600 185 \
            "dist/dmg/EmailDownloader-Installer.dmg" \
            "dist/EmailDownloader.app"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmailDownloader-macOS-Installer
          path: dist/dmg/EmailDownloader-Installer.dmg
          if-no-files-found: error
